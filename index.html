<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hex-Gen</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <textarea
      id="output"
      aria-label="OUTPUT"
      title="Hex-Werte"
      readonly
      placeholder="Generiere Hex-Werte mit dem Button"></textarea>
    <div class="input-container">
      <input
        type="number"
        id="amount-input"
        title="Label für Hex-Werte"
        placeholder="Anzahl Werte?" />
      <input
        type="number"
        id="digits-input"
        title="Anzahl der Stellen"
        placeholder="Stellen?" />
    </div>
    <button id="gen-btn">Generieren</button>
    <button id="copy-btn">Kopieren</button>
    <script src="gen.js"></script>
  </body>
</html>
