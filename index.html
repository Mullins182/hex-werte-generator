<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hex Value Generator</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <textarea
      id="output"
      aria-label="OUTPUT"
      title="Hex-Values Output"
      readonly
      placeholder="Generate Hex Values with the Button below !"></textarea>
    <div class="input-container">
      <input
        type="number"
        id="amount-input"
        title="Hex Values amount"
        placeholder="Hex Values amount ?" />
      <input
        type="number"
        id="digits-input"
        title="Digits per Hex Value"
        placeholder="Digits per Hex Value ?" />
    </div>
    <button id="gen-btn">Generate</button>
    <button id="copy-btn">Copy</button>
    <script src="gen_hex_values.js"></script>
  </body>
</html>
